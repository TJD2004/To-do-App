<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taskboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #0e0e0d;
    --bg2:       #161614;
    --bg3:       #1f1f1c;
    --border:    #2e2e2a;
    --border2:   #3d3d38;
    --text:      #e8e6df;
    --muted:     #7a7870;
    --amber:     #e8a020;
    --amber-dim: #9a6a10;
    --green:     #4a9e6a;
    --red:       #b84040;
    --blue:      #4a82b4;
    --cat-personal: #8b6fa0;
    --cat-work:     #4a82b4;
    --cat-shopping: #6aaa6a;
    --cat-health:   #d07040;
    --cat-finance:  #c0a040;
    --cat-other:    #7a7870;
    --font-mono: 'DM Mono', monospace;
    --font-display: 'Playfair Display', serif;
    --radius: 2px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 300;
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── Layout ─────────────────────────────────────────────────────────── */
  .shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: auto 1fr;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────────────────────────────────── */
  header {
    grid-column: 1 / -1;
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    background: var(--bg2);
  }

  .logo {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .logo span { color: var(--amber); }

  .header-meta {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  /* ── Sidebar ─────────────────────────────────────────────────────────── */
  aside {
    border-right: 1px solid var(--border);
    background: var(--bg2);
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .sidebar-section label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .filter-group { display: flex; flex-direction: column; gap: 2px; }

  .filter-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 300;
    cursor: pointer;
    padding: 7px 10px;
    text-align: left;
    border-radius: var(--radius);
    transition: background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filter-btn:hover { background: var(--bg3); color: var(--text); }
  .filter-btn.active { background: var(--bg3); color: var(--amber); }
  .filter-btn .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }
  .filter-btn .count {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 99px;
  }

  /* ── Stats strip ─────────────────────────────────────────────────────── */
  .stats { display: flex; flex-direction: column; gap: 10px; }
  .stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
  }
  .stat-label { font-size: 11px; color: var(--muted); }
  .stat-value { font-size: 20px; font-weight: 500; color: var(--text); }

  /* ── Main ─────────────────────────────────────────────────────────────── */
  main {
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow-y: auto;
  }

  /* ── Toolbar ─────────────────────────────────────────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .toolbar-title {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    margin-right: auto;
  }

  .sort-select {
    background: var(--bg2);
    border: 1px solid var(--border2);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }
  .sort-select:hover { border-color: var(--amber-dim); }

  .btn {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
    border-radius: var(--radius);
    border: none;
    padding: 7px 16px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--amber);
    color: #0e0e0d;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .btn-primary:hover { opacity: 0.85; }

  .btn-ghost {
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted);
  }
  .btn-ghost:hover { border-color: var(--amber-dim); color: var(--text); }

  /* ── Create form ─────────────────────────────────────────────────────── */
  .create-panel {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-left: 3px solid var(--amber);
    border-radius: var(--radius);
    padding: 20px;
    display: none;
    flex-direction: column;
    gap: 14px;
    animation: slideDown 0.2s ease;
  }
  .create-panel.open { display: flex; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .form-row { display: flex; gap: 12px; }
  .form-col { display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .form-col label { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }

  input[type="text"],
  input[type="date"],
  textarea,
  select {
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 300;
    padding: 8px 10px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input[type="text"]:focus,
  input[type="date"]:focus,
  textarea:focus,
  select:focus { border-color: var(--amber); }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  textarea { resize: vertical; min-height: 60px; }

  .form-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* ── Tasks list ──────────────────────────────────────────────────────── */
  #task-list { display: flex; flex-direction: column; gap: 2px; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-style: italic;
    font-size: 14px;
  }

  /* ── Task card ───────────────────────────────────────────────────────── */
  .task-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 12px;
    align-items: start;
    transition: border-color 0.15s, background 0.15s;
    animation: fadeIn 0.2s ease;
  }
  .task-card:hover { border-color: var(--border2); background: var(--bg3); }
  .task-card.completed { opacity: 0.5; }
  .task-card.completed .task-title { text-decoration: line-through; color: var(--muted); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* check circle */
  .check-btn {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--border2);
    background: none;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }
  .check-btn:hover { border-color: var(--green); }
  .task-card.completed .check-btn {
    background: var(--green);
    border-color: var(--green);
  }
  .task-card.completed .check-btn::after {
    content: '';
    position: absolute;
    left: 4px; top: 2px;
    width: 5px; height: 8px;
    border: 1.5px solid #0e0e0d;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }

  /* task body */
  .task-body { min-width: 0; }
  .task-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }

  .task-title {
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    word-break: break-word;
  }

  .cat-pill {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 99px;
    border: 1px solid currentColor;
    flex-shrink: 0;
  }

  .task-desc {
    font-size: 11px;
    color: var(--muted);
    word-break: break-word;
    line-height: 1.6;
  }

  .task-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 6px;
  }
  .task-date { font-size: 10px; color: var(--muted); }
  .task-date.overdue { color: var(--red); }
  .task-date.overdue::before { content: '⚠ '; }

  /* actions */
  .task-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .task-card:hover .task-actions { opacity: 1; }

  .icon-btn {
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: var(--radius);
    transition: color 0.12s, border-color 0.12s;
  }
  .icon-btn:hover.edit  { color: var(--blue);  border-color: var(--blue); }
  .icon-btn:hover.del   { color: var(--red);   border-color: var(--red); }

  /* ── Edit inline panel ───────────────────────────────────────────────── */
  .edit-panel {
    grid-column: 2 / -1;
    background: var(--bg);
    border: 1px solid var(--amber-dim);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
    animation: slideDown 0.15s ease;
  }

  /* ── Toast ───────────────────────────────────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 28px; right: 28px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-left: 3px solid var(--amber);
    color: var(--text);
    font-size: 12px;
    padding: 10px 16px;
    border-radius: var(--radius);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 999;
    max-width: 280px;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { border-left-color: var(--red); }

  /* ── Scrollbar ───────────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── Responsive ──────────────────────────────────────────────────────── */
  @media (max-width: 700px) {
    .shell { grid-template-columns: 1fr; }
    aside { display: none; }
    main { padding: 16px; }
  }
</style>
</head>
<body>

<div class="shell">

  <!-- ── Header ── -->
  <header>
    <div class="logo">Task<span>board</span></div>
    <div class="header-meta" id="header-date"></div>
  </header>

  <!-- ── Sidebar ── -->
  <aside>
    <div class="sidebar-section">
      <label>Filter</label>
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">
          <span class="dot" style="background:var(--muted)"></span> All tasks
          <span class="count" id="cnt-all">0</span>
        </button>
        <button class="filter-btn" data-filter="pending">
          <span class="dot" style="background:var(--amber)"></span> Pending
          <span class="count" id="cnt-pending">0</span>
        </button>
        <button class="filter-btn" data-filter="completed">
          <span class="dot" style="background:var(--green)"></span> Completed
          <span class="count" id="cnt-completed">0</span>
        </button>
        <button class="filter-btn" data-filter="overdue">
          <span class="dot" style="background:var(--red)"></span> Overdue
          <span class="count" id="cnt-overdue">0</span>
        </button>
      </div>
    </div>

    <div class="sidebar-section">
      <label>Categories</label>
      <div class="filter-group" id="cat-filters">
        <button class="filter-btn" data-filter="cat:personal"  style="--c:var(--cat-personal)"><span class="dot" style="background:var(--cat-personal)"></span> Personal  <span class="count" id="cnt-personal">0</span></button>
        <button class="filter-btn" data-filter="cat:work"      style="--c:var(--cat-work)"><span class="dot" style="background:var(--cat-work)"></span> Work       <span class="count" id="cnt-work">0</span></button>
        <button class="filter-btn" data-filter="cat:shopping"  style="--c:var(--cat-shopping)"><span class="dot" style="background:var(--cat-shopping)"></span> Shopping   <span class="count" id="cnt-shopping">0</span></button>
        <button class="filter-btn" data-filter="cat:health"    style="--c:var(--cat-health)"><span class="dot" style="background:var(--cat-health)"></span> Health     <span class="count" id="cnt-health">0</span></button>
        <button class="filter-btn" data-filter="cat:finance"   style="--c:var(--cat-finance)"><span class="dot" style="background:var(--cat-finance)"></span> Finance    <span class="count" id="cnt-finance">0</span></button>
        <button class="filter-btn" data-filter="cat:other"     style="--c:var(--cat-other)"><span class="dot" style="background:var(--cat-other)"></span> Other      <span class="count" id="cnt-other">0</span></button>
      </div>
    </div>

    <div class="sidebar-section" style="margin-top:auto">
      <label>Overview</label>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Total</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Done</span>
          <span class="stat-value" id="stat-done" style="color:var(--green)">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Overdue</span>
          <span class="stat-value" id="stat-overdue" style="color:var(--red)">0</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-title" id="view-title">All Tasks</div>
      <select class="sort-select" id="sort-select">
        <option value="-createdAt">Newest first</option>
        <option value="dueDate">Due date ↑</option>
        <option value="-dueDate">Due date ↓</option>
        <option value="title">Title A–Z</option>
      </select>
      <button class="btn btn-primary" id="new-btn">+ New Task</button>
    </div>

    <!-- Create panel -->
    <div class="create-panel" id="create-panel">
      <div class="form-row">
        <div class="form-col" style="flex:2">
          <label>Title *</label>
          <input type="text" id="new-title" placeholder="What needs to be done?" />
        </div>
        <div class="form-col">
          <label>Category</label>
          <select id="new-cat">
            <option value="other">Other</option>
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="shopping">Shopping</option>
            <option value="health">Health</option>
            <option value="finance">Finance</option>
          </select>
        </div>
        <div class="form-col">
          <label>Due Date</label>
          <input type="date" id="new-due" />
        </div>
      </div>
      <div class="form-col">
        <label>Description</label>
        <textarea id="new-desc" placeholder="Optional details…"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="save-btn">Create Task</button>
      </div>
    </div>

    <!-- Task list -->
    <div id="task-list">
      <div class="empty-state">Loading tasks…</div>
    </div>

  </main>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════════════════════════════
//  Config
// ════════════════════════════════════════════════════════
const API = 'http://localhost:3000/api/tasks';
const CAT_COLORS = {
  personal:'var(--cat-personal)', work:'var(--cat-work)',
  shopping:'var(--cat-shopping)', health:'var(--cat-health)',
  finance:'var(--cat-finance)',   other:'var(--cat-other)'
};

// ════════════════════════════════════════════════════════
//  State
// ════════════════════════════════════════════════════════
let allTasks = [];
let currentFilter = 'all';
let currentSort = '-createdAt';

// ════════════════════════════════════════════════════════
//  API helpers
// ════════════════════════════════════════════════════════
async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.message || json.errors?.[0]?.message || 'Request failed');
  return json.data;
}

// ════════════════════════════════════════════════════════
//  Toast
// ════════════════════════════════════════════════════════
let toastTimer;
function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (err ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2800);
}

// ════════════════════════════════════════════════════════
//  Fetch & render
// ════════════════════════════════════════════════════════
async function loadTasks() {
  try {
    const params = new URLSearchParams({ sort: currentSort });
    const data = await api(`?${params}`);
    allTasks = data.tasks;
    renderTasks();
    updateSidebar();
  } catch(e) {
    toast(e.message, true);
  }
}

function getFiltered() {
  return allTasks.filter(t => {
    if (currentFilter === 'pending')   return !t.completed;
    if (currentFilter === 'completed') return t.completed;
    if (currentFilter === 'overdue')   return t.isOverdue;
    if (currentFilter.startsWith('cat:')) return t.category === currentFilter.slice(4);
    return true;
  });
}

function renderTasks() {
  const list = document.getElementById('task-list');
  const tasks = getFiltered();

  if (!tasks.length) {
    list.innerHTML = '<div class="empty-state">No tasks here — create one above.</div>';
    return;
  }

  list.innerHTML = '';
  tasks.forEach(t => list.appendChild(buildCard(t)));
}

function updateSidebar() {
  const now = new Date();
  const overdue = allTasks.filter(t => t.dueDate && !t.completed && new Date(t.dueDate) < now);
  const done    = allTasks.filter(t => t.completed);

  document.getElementById('cnt-all').textContent       = allTasks.length;
  document.getElementById('cnt-pending').textContent   = allTasks.filter(t => !t.completed).length;
  document.getElementById('cnt-completed').textContent = done.length;
  document.getElementById('cnt-overdue').textContent   = overdue.length;

  ['personal','work','shopping','health','finance','other'].forEach(cat => {
    document.getElementById('cnt-' + cat).textContent =
      allTasks.filter(t => t.category === cat).length;
  });

  document.getElementById('stat-total').textContent   = allTasks.length;
  document.getElementById('stat-done').textContent    = done.length;
  document.getElementById('stat-overdue').textContent = overdue.length;
}

// ════════════════════════════════════════════════════════
//  Build task card DOM
// ════════════════════════════════════════════════════════
function buildCard(t) {
  const card = document.createElement('div');
  card.className = 'task-card' + (t.completed ? ' completed' : '');
  card.dataset.id = t._id;

  const now = new Date();
  const overdue = t.dueDate && !t.completed && new Date(t.dueDate) < now;

  card.innerHTML = `
    <button class="check-btn" title="${t.completed ? 'Completed' : 'Mark complete'}"></button>
    <div class="task-body">
      <div class="task-top">
        <span class="task-title">${esc(t.title)}</span>
        <span class="cat-pill" style="color:${CAT_COLORS[t.category] || 'var(--muted)'}">${t.category}</span>
      </div>
      ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ''}
      <div class="task-meta">
        <span class="task-date">${fmtDate(t.createdAt, 'Created')}</span>
        ${t.dueDate ? `<span class="task-date${overdue ? ' overdue' : ''}">${fmtDate(t.dueDate, 'Due')}</span>` : ''}
        ${t.completedAt ? `<span class="task-date" style="color:var(--green)">${fmtDate(t.completedAt, 'Done')}</span>` : ''}
      </div>
    </div>
    <div class="task-actions">
      ${!t.completed ? `<button class="icon-btn edit" title="Edit">edit</button>` : ''}
      <button class="icon-btn del" title="Delete">del</button>
    </div>
  `;

  // Complete toggle
  card.querySelector('.check-btn').addEventListener('click', () => toggleComplete(t));

  // Edit
  const editBtn = card.querySelector('.icon-btn.edit');
  if (editBtn) editBtn.addEventListener('click', () => openEdit(card, t));

  // Delete
  card.querySelector('.icon-btn.del').addEventListener('click', () => deleteTask(t._id));

  return card;
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function fmtDate(iso, label) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${label} ${d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })}`;
}

// ════════════════════════════════════════════════════════
//  Actions
// ════════════════════════════════════════════════════════
async function toggleComplete(t) {
  if (t.completed) return; // already done, no op
  try {
    await api(`/${t._id}/complete`, { method: 'PATCH' });
    toast('Task completed ✓');
    await loadTasks();
  } catch(e) { toast(e.message, true); }
}

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  try {
    await api(`/${id}`, { method: 'DELETE' });
    toast('Task deleted');
    await loadTasks();
  } catch(e) { toast(e.message, true); }
}

// ── Inline edit panel ──────────────────────────────────
function openEdit(card, t) {
  // close any existing edit panel
  document.querySelectorAll('.edit-panel').forEach(p => p.remove());

  const panel = document.createElement('div');
  panel.className = 'edit-panel';
  panel.innerHTML = `
    <div class="form-row">
      <div class="form-col" style="flex:2">
        <label>Title</label>
        <input type="text" class="e-title" value="${esc(t.title)}" />
      </div>
      <div class="form-col">
        <label>Category</label>
        <select class="e-cat">
          ${['other','personal','work','shopping','health','finance']
            .map(c => `<option value="${c}"${c===t.category?' selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="form-col">
        <label>Due Date</label>
        <input type="date" class="e-due" value="${t.dueDate ? t.dueDate.slice(0,10) : ''}" />
      </div>
    </div>
    <div class="form-col">
      <label>Description</label>
      <textarea class="e-desc">${esc(t.description || '')}</textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost e-cancel">Cancel</button>
      <button class="btn btn-primary e-save">Save Changes</button>
    </div>
  `;

  card.appendChild(panel);
  panel.querySelector('.e-title').focus();

  panel.querySelector('.e-cancel').addEventListener('click', () => panel.remove());
  panel.querySelector('.e-save').addEventListener('click', async () => {
    const body = {
      title:       panel.querySelector('.e-title').value.trim(),
      description: panel.querySelector('.e-desc').value.trim(),
      category:    panel.querySelector('.e-cat').value,
      dueDate:     panel.querySelector('.e-due').value || null,
    };
    if (!body.title) { toast('Title is required', true); return; }
    try {
      await api(`/${t._id}`, { method: 'PATCH', body: JSON.stringify(body) });
      toast('Task updated');
      await loadTasks();
    } catch(e) { toast(e.message, true); }
  });
}

// ════════════════════════════════════════════════════════
//  Create new task
// ════════════════════════════════════════════════════════
document.getElementById('new-btn').addEventListener('click', () => {
  const panel = document.getElementById('create-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) document.getElementById('new-title').focus();
});

document.getElementById('cancel-btn').addEventListener('click', closeCreate);

document.getElementById('save-btn').addEventListener('click', async () => {
  const title = document.getElementById('new-title').value.trim();
  if (!title) { toast('Title is required', true); return; }

  const body = {
    title,
    description: document.getElementById('new-desc').value.trim(),
    category:    document.getElementById('new-cat').value,
    dueDate:     document.getElementById('new-due').value || null,
  };

  try {
    await api('', { method: 'POST', body: JSON.stringify(body) });
    toast('Task created');
    closeCreate();
    await loadTasks();
  } catch(e) { toast(e.message, true); }
});

// Enter key in title field
document.getElementById('new-title').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('save-btn').click();
});

function closeCreate() {
  document.getElementById('create-panel').classList.remove('open');
  document.getElementById('new-title').value = '';
  document.getElementById('new-desc').value = '';
  document.getElementById('new-due').value = '';
  document.getElementById('new-cat').value = 'other';
}

// ════════════════════════════════════════════════════════
//  Filters & sort
// ════════════════════════════════════════════════════════
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    const labels = {
      all:'All Tasks', pending:'Pending', completed:'Completed', overdue:'Overdue',
      'cat:personal':'Personal','cat:work':'Work','cat:shopping':'Shopping',
      'cat:health':'Health','cat:finance':'Finance','cat:other':'Other'
    };
    document.getElementById('view-title').textContent = labels[currentFilter] || currentFilter;
    renderTasks();
  });
});

document.getElementById('sort-select').addEventListener('change', async e => {
  currentSort = e.target.value;
  await loadTasks();
});

// ════════════════════════════════════════════════════════
//  Init
// ════════════════════════════════════════════════════════
document.getElementById('header-date').textContent =
  new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

loadTasks();
</script>
</body>
</html>
